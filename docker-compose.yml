# Dev tasks. The MCP client itself does not use compose — it launches the
# container directly over stdio (see docs/setup.md).
services:
  server:
    build: .
    image: comunio-mcp
    stdin_open: true
    volumes:
      - ./src:/app/src

  test:
    build: .
    image: comunio-mcp
    entrypoint: ["pytest"]
    command: ["-q"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

  lint:
    build: .
    image: comunio-mcp
    entrypoint: ["ruff"]
    command: ["check", "."]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

  # Checks real credentials against api.comunio.es. Reads them from .env, which is
  # git-ignored. Prints no token.
  auth-check:
    build: .
    image: comunio-mcp
    entrypoint: ["python", "-m", "comunio_mcp.check_auth"]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
