name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: comunio-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker compose run` reuses the image just built (tag `comunio-mcp:latest`
      # matches what the compose file references) instead of rebuilding it without
      # the GHA cache.
      - name: Run tests
        run: docker compose run --rm test
