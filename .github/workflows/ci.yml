name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # server.json is what the MCP Registry serves. Drift between it, pyproject.toml and
  # the ownership label in the Dockerfile is only noticed at release time otherwise.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check server.json agrees with the rest of the repo
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          name=$(jq -r .name server.json)

          test "$(jq -r .version server.json)" = "$version" \
            || { echo "server.json version != pyproject.toml version ($version)" >&2; exit 1; }

          test "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/${{ github.repository }}:$version" \
            || { echo "server.json package identifier is not the image for $version" >&2; exit 1; }

          grep -q "io.modelcontextprotocol.server.name=\"$name\"" Dockerfile \
            || { echo "Dockerfile ownership label != server.json name ($name)" >&2; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: comunio-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker compose run --rm -v ${{ github.workspace }}:/out test \
            -q --cov=comunio_mcp --cov-report=xml:/out/coverage.xml --junitxml=/out/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: tests
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: tests
          disable_search: true
          fail_ci_if_error: true
