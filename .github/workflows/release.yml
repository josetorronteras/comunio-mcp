name: Release

# Pushing a v* tag publishes the image and the registry entry. Nothing here runs on a
# pull request: both steps are one-way.
on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR
      id-token: write   # OIDC, so the MCP Registry can verify the publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that does not match pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "Tag v$VERSION does not match pyproject.toml version $declared." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The registry resolves the image by the tag written in server.json, so it has to
      # be the one just pushed.
      - name: Pin the released version in server.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          jq --arg v "$VERSION" --arg image "$IMAGE:$VERSION" \
            '.version = $v | .packages[0].identifier = $image' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
