[project]
name = "comunio-mcp"
version = "1.0.2"
description = "MCP server for Comunio, the online football fantasy manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jose Torronteras" }]
keywords = ["mcp", "model-context-protocol", "comunio", "fantasy-football"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/josetorronteras/comunio-mcp"
Documentation = "https://github.com/josetorronteras/comunio-mcp/tree/main/docs"
Issues = "https://github.com/josetorronteras/comunio-mcp/issues"
Changelog = "https://github.com/josetorronteras/comunio-mcp/blob/main/CHANGELOG.md"

[project.scripts]
comunio-mcp = "comunio_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comunio_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: with the plain prepend mode, the bind-mounted ./tests makes pytest
# resolve tests.conftest twice on some hosts and refuse to collect anything.
addopts = ["--import-mode=importlib"]
