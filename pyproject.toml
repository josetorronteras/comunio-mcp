[project]
name = "comunio-mcp"
version = "1.0.0"
description = "MCP server for Comunio, the online football fantasy manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
]

[project.scripts]
comunio-mcp = "comunio_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comunio_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
